<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ app_name }}</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <h1>{{ app_name }}</h1>
        <p id="profileLine">{{ t("web.profile_ready") }}</p>
      </div>
      <div class="top-actions">
        <button id="historyBtn" class="icon-btn" title="{{ t("web.history") }}">{{ t("web.history_short") }}</button>
        <button id="adminBtn" class="icon-btn hidden" title="{{ t("web.admin") }}">{{ t("web.admin_short") }}</button>
      </div>
    </header>

    <section class="search-band">
      <select id="entityType" aria-label="{{ t("web.entity_type") }}">
        <option value="auto">{{ t("web.auto") }}</option>
        <option value="telegram">{{ t("web.telegram") }}</option>
        <option value="username">{{ t("web.username") }}</option>
        <option value="email">{{ t("web.email") }}</option>
        <option value="phone">{{ t("web.phone") }}</option>
        <option value="domain">{{ t("web.domain") }}</option>
        <option value="url">{{ t("web.url") }}</option>
        <option value="ip">{{ t("web.ip") }}</option>
        <option value="image_url">{{ t("web.image_url") }}</option>
        <option value="pdf_url">{{ t("web.pdf_url") }}</option>
      </select>
      <input id="queryInput" maxlength="500" autocomplete="off" placeholder="{{ t("web.placeholder") }}">
      <button id="searchBtn">{{ t("web.search") }}</button>
      <button id="deepBtn">{{ t("web.deep") }}</button>
    </section>

    <section class="workspace">
      <div class="graph-pane">
        <div class="pane-title">
          <span>{{ t("web.graph") }}</span>
          <div class="graph-tools">
            <input id="graphSearch" class="graph-search" placeholder="{{ t("web.search_graph") }}">
            <div id="groupFilters" class="filters"></div>
          </div>
        </div>
        <div id="graph"></div>
      </div>

      <aside class="side-pane">
        <section>
          <h2>{{ t("web.summary") }}</h2>
          <div id="summary" class="metric-grid"></div>
        </section>
        <section>
          <h2>{{ t("web.findings") }}</h2>
          <div id="findings" class="stack"></div>
        </section>
        <section>
          <h2>{{ t("web.history") }}</h2>
          <div id="history" class="stack compact"></div>
        </section>
        <section id="adminPanel" class="hidden">
          <h2>{{ t("web.admin") }}</h2>
          <div id="adminStats" class="metric-grid"></div>
          <h2>{{ t("web.provider_health") }}</h2>
          <div id="providerHealth" class="stack compact"></div>
        </section>
      </aside>
    </section>
  </main>
  <script>
    window.__I18N__ = {{ i18n_json | safe }};
  </script>
  <script src="/js/graph-visualization.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
